spring:
  application:
    name: ChallengeBackendCocos-Test
  datasource:
    url: jdbc:h2:mem:cocostestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        auto_quote_keyword: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
